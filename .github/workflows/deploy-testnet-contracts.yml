name: Deploy testnet contracts

# Manually triggered. Deploys ERC5564Announcer + QuietPayTestUSDG (mock) to
# Robinhood Chain Testnet (46630) using the DEPLOYER_PRIVATE_KEY repository secret,
# verifies them, and prints the env values for the web app in the run summary.
#
# Use a throwaway key funded with testnet ETH only. Never your main wallet.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "What to deploy, comma separated: announcer, token, router, pool, poolrouter, guardian, handover"
        required: true
        default: "router"
      postman:
        description: "For pool: the relayer's address (its public address, never its key)"
        required: false
        default: ""
      guardian_admin:
        description: "For guardian: its admin address (ideally a multisig)"
        required: false
        default: ""
      guardian_delay_seconds:
        description: "For guardian: delay before any change takes effect (3600 to 2592000)"
        required: false
        default: "86400"
      guardian_address:
        description: "For handover: the deployed guardian's address"
        required: false
        default: ""
      confirm_handover:
        description: "For handover: type yes to give the pool's owner role to the guardian and renounce the deployer's"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check secret
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::Add a DEPLOYER_PRIVATE_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Deploy
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOY: ${{ inputs.deploy }}
          POSTMAN_ADDRESS: ${{ inputs.postman }}
          GUARDIAN_ADMIN: ${{ inputs.guardian_admin }}
          GUARDIAN_DELAY_SECONDS: ${{ inputs.guardian_delay_seconds }}
          GUARDIAN_ADDRESS: ${{ inputs.guardian_address }}
          CONFIRM_HANDOVER: ${{ inputs.confirm_handover }}
        shell: bash
        run: |
          set -o pipefail
          npm run contracts:deploy 2>&1 | tee deploy.log
          grep -oE 'NEXT_PUBLIC_TESTNET_[A-Z_]+=(0x[0-9a-fA-F]{40}|[0-9]+)' deploy.log > addresses.txt || true
          if [ ! -s addresses.txt ]; then
            echo "::error::Deploy printed no contract addresses. See the log above."
            exit 1
          fi
          cat addresses.txt >> "$GITHUB_ENV"

      - name: Verify onchain
        run: npm run contracts:verify

      - name: Summary
        if: always()
        run: |
          {
            echo "## QuietPay testnet contracts"
            echo
            echo "Add these to your hosting provider's environment variables, then redeploy:"
            echo
            echo '```'
            cat addresses.txt 2>/dev/null || echo "(no addresses deployed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
