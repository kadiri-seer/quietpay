name: Tests

# Every push and pull request: type check and the full test suite, including the end-to-end
# tests against a local chain (anvil) with real pool proofs. Vercel also runs the type check and
# the unit tests before each deploy (npm run vercel-build), so a failing build never goes live.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
